name: master-bank-quality

on:
  pull_request:
    paths:
      - 'master-bank/**'
      - '.github/workflows/master-bank-quality.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural audit
        continue-on-error: true
        run: python master-bank/tools/audit_master_bank.py
      - name: Source coverage audit
        run: python master-bank/tools/audit_source_coverage.py
      - name: Source representation audit
        run: python master-bank/tools/audit_source_representation.py
      - name: Review status audit
        run: python master-bank/tools/audit_review_status.py
      - name: Conflict-resolution coverage audit
        run: python master-bank/tools/audit_conflict_resolution_coverage.py --output master-bank/reports/conflict-resolution-coverage.json
      - name: Upload conflict-resolution coverage
        uses: actions/upload-artifact@v4
        with:
          name: conflict-resolution-coverage
          path: master-bank/reports/conflict-resolution-coverage.json
          retention-days: 1
      - name: Duplicate report
        continue-on-error: true
        run: python master-bank/tools/detect_duplicate_questions.py
      - name: Asset validation
        continue-on-error: true
        run: python master-bank/tools/validate_assets.py
      - name: Build manifest
        run: python master-bank/tools/build_manifest.py
