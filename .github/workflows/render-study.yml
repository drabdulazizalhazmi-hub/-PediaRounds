name: Render study beta checks
on:
  pull_request:
    paths:
      - 'deployment/render/**'
      - '.github/workflows/render-study.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/render/**'
      - '.github/workflows/render-study.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing backend plus browser bridge and bank tests
        run: node --test deployment/render/server.test.mjs
      - name: Syntax check all study modules
        run: |
          for file in deployment/render/study-*.mjs; do node --check "$file"; done
      - name: Chromium browser flow with fictional identity provider
        env:
          STUDY_BROWSER_OUTPUT: ${{ runner.temp }}/study-browser-results
        run: node deployment/render/study-browser-check.mjs
      - name: Save browser verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-browser-verification
          path: ${{ runner.temp }}/study-browser-results
          if-no-files-found: warn
          retention-days: 7
