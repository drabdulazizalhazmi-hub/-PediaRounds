name: Render study beta checks
on:
  pull_request:
    paths:
      - 'deployment/render/**'
      - '.github/workflows/render-study.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/render/**'
      - '.github/workflows/render-study.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing backend plus browser bridge and bank tests
        run: node --test deployment/render/server.test.mjs
      - name: Syntax check all study modules
        run: |
          for file in deployment/render/study-*.mjs; do node --check "$file"; done
