name: master-bank-normalize-once

on:
  push:
    branches:
      - master-bank/scfhs-merge
    paths:
      - 'master-bank/tools/normalize_unverified_answers.py'
      - '.github/workflows/master-bank-normalize-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-bank/scfhs-merge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize unsupported verified states and incomplete placeholders
        run: python master-bank/tools/normalize_unverified_answers.py --write
      - name: Commit normalization results
        shell: bash
        run: |
          if git diff --quiet -- master-bank/data; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'PediaRounds QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add master-bank/data
          git commit -m 'fix(master-bank): normalize unsupported verification states'
          git push origin HEAD:master-bank/scfhs-merge
